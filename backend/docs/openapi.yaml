openapi: 3.0.3
info:
  title: SOLSTICE BANK API
  version: 0.1.0
  description: >
    API de la banque fictive SOLSTICE BANK. Tous les montants sont en centimes
    (12345 = 123,45 €). Démonstration, argent fictif.
servers:
  - url: http://localhost:3000
tags:
  - name: Santé
  - name: Authentification
  - name: Transactions

paths:
  /api/health:
    get:
      tags: [Santé]
      summary: Vérifier que l'API répond
      security: []
      responses:
        "200":
          description: API opérationnelle
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }

  /api/auth/register:
    post:
      tags: [Authentification]
      summary: Créer un compte
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "201":
          description: Compte créé, JWT renvoyé
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "409":
          description: Email déjà utilisé
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error:
                  {
                    code: EMAIL_ALREADY_USED,
                    message: Cet email est déjà utilisé.,
                  }

  /api/auth/login:
    post:
      tags: [Authentification]
      summary: Se connecter
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "200":
          description: Connexion réussie, JWT renvoyé
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/transactions:
    get:
      tags: [Transactions]
      summary: Récupérer les transactions de l'utilisateur
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Liste des transactions
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Transaction"
        "401":
          description: Non authentifié

    post:
      tags: [Transactions]
      summary: Créer une transaction
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionInput"
      responses:
        "201":
          description: Transaction créée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          description: Données invalides
        "401":
          description: Non authentifié

  /api/transactions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: "^[0-9a-fA-F]{24}$"

    get:
      tags: [Transactions]
      summary: Récupérer une transaction par son ID
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Transaction trouvée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          description: Identifiant invalide
        "401":
          description: Non authentifié
        "404":
          description: Transaction introuvable

    patch:
      tags: [Transactions]
      summary: Modifier une transaction
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionUpdate"
      responses:
        "200":
          description: Transaction modifiée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          description: Données ou identifiant invalides
        "401":
          description: Non authentifié
        "404":
          description: Transaction introuvable

    delete:
      tags: [Transactions]
      summary: Supprimer une transaction
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Transaction supprimée
        "400":
          description: Identifiant invalide
        "401":
          description: Non authentifié
        "404":
          description: Transaction introuvable

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                [
                  INVALID_INPUT,
                  UNAUTHORIZED,
                  FORBIDDEN,
                  NOT_FOUND,
                  CONFLICT,
                  EMAIL_ALREADY_USED,
                  INSUFFICIENT_FUNDS,
                  INTERNAL_ERROR,
                ]
            message: { type: string }

    Credentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, example: alice@example.test }
        password: { type: string, minLength: 8, example: MotDePasse123! }

    AuthResponse:
      type: object
      required: [user, token]
      properties:
        user:
          type: object
          required: [id, email]
          properties:
            id: { type: string, example: 507f1f77bcf86cd799439011 }
            email: { type: string, example: alice@example.test }
        token: { type: string, description: JWT signé }

    TransactionInput:
      type: object
      additionalProperties: false
      required: [label, amount, type, date]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 120
          example: Courses
        amount:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          description: Montant en centimes
          example: 2500
        type:
          type: string
          enum: [income, expense]
          example: expense
        date:
          type: string
          format: date
          example: "2026-10-27"

    TransactionUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 120
        amount:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        type:
          type: string
          enum: [income, expense]
        date:
          type: string
          format: date

    Transaction:
      type: object
      required: [id, ownerId, label, amount, type, date]
      properties:
        id:
          type: string
          example: "671f5a2b8c9d123456789abc"
        ownerId:
          type: string
          example: "671f5a2b8c9d123456789def"
        label:
          type: string
          example: Courses
        amount:
          type: integer
          description: Montant en centimes
          example: 2500
        type:
          type: string
          enum: [income, expense]
        date:
          type: string
          format: date
          example: "2026-10-27"

  responses:
    InvalidInput:
      description: Corps, champ ou identifiant invalide
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              {
                code: INVALID_INPUT,
                message: "password : 8 caractères minimum",
              }
    Unauthorized:
      description: JWT absent, invalide ou expiré, ou identifiants incorrects
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: { code: UNAUTHORIZED, message: Authentification requise. }
    NotFound:
      description: Ressource absente ou appartenant à un autre utilisateur
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: { code: NOT_FOUND, message: Ressource introuvable. }

# Par défaut, toute route exige un JWT. Les routes publiques mettent « security: [] ».
security:
  - bearerAuth: []
